---
layout: default
title: Contact
description: Get in touch with Fahimeh Amiri about her work.
---

<div class="prose">
  <h1>Contact</h1>
  <p>
    I'd love to hear from you. Please fill out the form below, and I'll get back
    to you as soon as I can.
  </p>
</div>

<form class="contact-form" id="contact-form">
  <label>
    Name
    <input type="text" name="name" required maxlength="100" autocomplete="name" />
  </label>

  <label>
    Email
    <input type="email" name="email" required maxlength="200" autocomplete="email" />
  </label>

  <label>
    Message
    <textarea name="message" required maxlength="4000"></textarea>
  </label>

  <!--
    Honeypot. A real visitor never sees this field, so anything that fills it in
    is a bot. The Apps Script drops those submissions without writing a row.
  -->
  <div class="hp" aria-hidden="true">
    <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off" /></label>
  </div>

  <button type="submit">Send</button>
  <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
</form>

<script>
  (function () {
    var endpoint = {{ site.contact_endpoint | jsonify }};
    var form = document.getElementById("contact-form");
    var status = document.getElementById("form-status");
    var button = form.querySelector("button");

    function say(text, state) {
      status.textContent = text;
      if (state) { status.setAttribute("data-state", state); }
      else { status.removeAttribute("data-state"); }
    }

    /*
      An Apps Script web app cannot send back Access-Control-Allow-Origin, so a
      normal cross-origin POST is blocked before the browser will show us the
      response. `mode: "no-cors"` sends it anyway and hands back an opaque
      response we are not allowed to read -- the submission lands in the Sheet,
      but the page cannot be told so.

      That is the whole reason the success message here is optimistic. It is a
      real trade-off, not an oversight: the alternative is a Google sign-in
      prompt or a paid form service. The mitigation is that the Apps Script
      emails Fahimeh on every submission, so a failure is visible as silence on
      a channel she is already watching, rather than as a lost message nobody
      knows about.

      URLSearchParams keeps this a "simple request" -- form-encoded, no custom
      headers -- which is what no-cors allows and what doPost's e.parameter
      expects. Sending JSON would trigger a preflight that no-cors forbids.
    */
    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (!endpoint) {
        say("This form isn't connected yet. Please email instead.", "error");
        return;
      }

      button.disabled = true;
      say("Sending…");

      fetch(endpoint, {
        method: "POST",
        mode: "no-cors",
        body: new URLSearchParams(new FormData(form)),
      })
        .then(function () {
          form.reset();
          say("Thank you — your message is on its way.");
        })
        .catch(function () {
          say("Something went wrong. Please try again, or email directly.", "error");
        })
        .then(function () {
          button.disabled = false;
        });
    });
  })();
</script>
