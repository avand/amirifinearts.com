<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />

    <meta property="og:title" content="{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}" />
    <meta property="og:description" content="{{ page.description | default: site.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      The Squarespace site set headings in futura-pt and body in proxima-nova,
      both Adobe fonts licensed through the Squarespace subscription. That
      licence does not travel with the content, so the migration cannot keep
      them. Jost is the closest free geometric sans to futura-pt, and Nunito
      Sans the closest to proxima-nova. If the difference ever matters enough,
      an Adobe Fonts plan of our own would restore the originals exactly.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/screen.css' | relative_url }}" />
  </head>

  <body>
    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        {% for item in site.nav %}
          <a href="{{ item.url | relative_url }}"
             {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.name }}</a>
        {% endfor %}
      </nav>
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    {% comment %}
      Only the pages that have a carousel load its script. Every slide is
      already in the markup, so the page is complete before this runs.
    {% endcomment %}
    {% if page.carousel %}
      <script src="{{ '/assets/carousel.js' | relative_url }}" defer></script>
    {% endif %}

  </body>
</html>
